<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shijun Pan — Researcher · Technology Manager · Lifelong Learner. Ph.D. from Okayama University, specializing in AI deep learning and river engineering.">
  <title>Shijun Pan | Personal Website</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="#home" class="nav-logo">Shijun Pan</a>
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#research">Research</a></li>
        <li><a href="#publications">Publications</a></li>
        <li><a href="#blog">Blog</a></li>
        <li><a href="#certifications">Honors</a></li>
        <li><a href="../">中文</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <section id="home" class="hero">
    <div class="container hero-inner" id="heroContent"></div>
  </section>

  <section id="about" class="section">
    <div class="container">
      <h2 class="section-title">About Me</h2>
      <div class="about-grid" id="aboutContent"></div>
    </div>
  </section>

  <section id="research" class="section section-alt">
    <div class="container">
      <h2 class="section-title">Research Areas</h2>
      <div class="research-grid" id="researchContent"></div>
    </div>
  </section>

  <section id="publications" class="section">
    <div class="container">
      <h2 class="section-title">Publications</h2>
      <div class="pub-stats" id="pubStats"></div>
      <div class="pub-tabs" id="pubTabs"></div>
      <div class="pub-list" id="journalsList"></div>
      <div class="pub-list hidden" id="conferencesList"></div>
    </div>
  </section>

  <section id="timeline" class="section section-alt">
    <div class="container">
      <h2 class="section-title">Research Timeline</h2>
      <div class="tl-vertical" id="timelineContent"></div>
    </div>
  </section>

  <section id="blog" class="section">
    <div class="container">
      <h2 class="section-title">Blog</h2>
      <p class="section-subtitle">Thoughts on research & technology transfer</p>
      <div class="blog-grid" id="blogGrid"></div>
    </div>
  </section>

  <section id="blog-display" class="section" style="display:none">
    <div class="container">
      <div id="blogContent" class="blog-article"></div>
    </div>
  </section>

  <section id="certifications" class="section section-alt">
    <div class="container">
      <h2 class="section-title">Honors & Experience</h2>
      <div class="cert-cats" id="certContent"></div>
    </div>
  </section>

  <footer id="contact" class="footer">
    <div class="container">
      <div class="footer-grid" id="footerContent"></div>
      <div class="footer-bottom">
        <p>&copy; 2026 Shijun Pan. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="../data.js"></script>
  <script src="en-script.js"></script>
</body>
</html>
